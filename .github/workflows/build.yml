name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the release step's job gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the GitHub Release
    steps:
      # Third-party actions are pinned to exact commits (supply-chain hardening).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "SIGNING_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the permanent signing key from repository secrets."
          else
            PW=$(openssl rand -base64 24)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PW" -keypass "$PW" \
              -alias standby -keyalg RSA -keysize 3072 -validity 365 -dname "CN=StandBy temporary" >/dev/null
            echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "::warning::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD secrets are not set - signed with a temporary key. Updates will need an uninstall first."
          fi
          echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|AAPT|Execution failed" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StandBy.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StandBy-apk
          path: StandBy.apk

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: StandBy v1.4.${{ github.run_number }}
          make_latest: true
          files: StandBy.apk
          body: |
            Download **StandBy.apk** below on your phone and tap it to install.
