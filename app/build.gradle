plugins {
    id 'com.android.application'
}

android {
    namespace 'com.siddhesh.standby'
    compileSdk 34

    defaultConfig {
        applicationId 'com.siddhesh.standby'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('standby.keystore')
            storePassword 'standby123'
            keyAlias 'standby'
            keyPassword 'standby123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
