plugins {
    id 'com.android.application'
}

android {
    namespace 'com.siddhesh.standby'
    compileSdk 34

    defaultConfig {
        applicationId 'com.siddhesh.standby'
        minSdk 28
        targetSdk 34
        // CI build number makes every release a higher version, so updates install over the old app
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionCode 100 + run
        versionName "1.4.${run}"
    }

    signingConfigs {
        // The key is never stored in the repo: CI writes it from GitHub Secrets
        // (SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD) to a temp file and passes the path here.
        release {
            def ks = System.getenv('SIGNING_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias System.getenv('SIGNING_ALIAS') ?: 'standby'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
